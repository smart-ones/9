.sdots i{width:9px;height:9px;border-radius:50%;background:var(--navy);animation:sdot 1.1s ease-in-out infinite}
.sdots i:nth-child(2){animation-delay:.15s;background:var(--blue)}
.sdots i:nth-child(3){animation-delay:.3s;background:var(--red)}
#sptx{font:700 15px Vazirmatn,Tahoma,sans-serif;color:#1b2a55;text-align:center;direction:rtl;line-height:1.8;padding:0 20px}
#sptx[hidden]{display:none}

/* ================= صفحهٔ ورود (هم‌سبک صفحهٔ ورود سامانهٔ آزمون) ================= */
html.lgn{background:#e9effc;overscroll-behavior-y:none}
body.lgn{background:#fff;overscroll-behavior-y:none}
body.lgn .top,body.lgn .foot{display:none}
body.lgn .wrap{width:100%;max-width:none;padding:0}
.lg{
  --tp:max(27vh,190px);--tp:max(27dvh,190px);
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;isolation:isolate;
  background:
    radial-gradient(60% 34% at 88% 52%,rgba(42,95,208,.95) 0,rgba(42,95,208,0) 72%),
    radial-gradient(55% 30% at 8% 86%,rgba(229,51,63,.85) 0,rgba(229,51,63,0) 72%),
    radial-gradient(70% 26% at 50% 66%,rgba(20,48,107,.9) 0,rgba(20,48,107,0) 75%),
    linear-gradient(180deg,#fff 0,#f1f5fd 36%,#c9d8f7 100%);
}
.lg-top{height:var(--tp);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;padding:calc(.6rem + var(--sat)) 1rem 1.8rem;text-align:center;animation:fade .7s}
.lg-logo{width:clamp(80px,13vh,118px);width:clamp(80px,13dvh,118px);height:auto;object-fit:contain;display:block;animation:pop .8s var(--ease);position:relative;top:-8px}
.lg-top h1{font-size:1.45rem;color:var(--navy);font-weight:800;line-height:1.25;margin-top:.2rem;position:relative;top:-7px}
.lg-top p{font-size:.88rem;color:var(--mut);line-height:1.2;margin-top:-.2rem;position:relative;top:-4px}
.lg-bot{
  flex:1;min-height:calc(100vh - var(--tp) + 1.6rem);min-height:calc(100dvh - var(--tp) + 1.6rem);margin-top:-1.6rem;position:relative;z-index:1;
  border-radius:34px 34px 0 0;padding:2rem 1.4rem calc(1.4rem + var(--sab));
  display:flex;flex-direction:column;align-items:center;animation:sheet .7s var(--ease) both;
  box-shadow:0 -18px 44px -6px rgba(13,31,76,.34),0 -3px 10px rgba(13,31,76,.14);
}
.lg-bot::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(165deg,rgba(255,255,255,.78) 0,rgba(255,255,255,.58) 32%,rgba(13,31,76,.5) 100%);
  border:1px solid rgba(255,255,255,.46);border-bottom:0;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.75),inset 0 0 34px rgba(255,255,255,.12),inset 0 -40px 60px -30px rgba(13,31,76,.25)}
.lg-bot::after{content:"";position:absolute;left:12%;right:12%;top:0;height:1px;z-index:0;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent)}
.lg-bot>*{position:relative;z-index:1}
.lg-grab{width:46px;height:5px;border-radius:9px;background:rgba(255,255,255,.65);margin:-.9rem auto 1.2rem;box-shadow:0 1px 3px rgba(13,31,76,.25)}
.lg-head{width:100%;max-width:400px;text-align:center;margin-bottom:1.4rem}
.lg-head h2{font-size:1.4rem;font-weight:800;color:var(--navy);margin:0}
.lg-head p{margin-top:.4rem;font-size:.88rem;line-height:1.8;color:#171c2b;font-weight:600}
.lg-form{width:100%;max-width:400px;display:flex;flex-direction:column;gap:.7rem}
.lg-f{position:relative}
.lg .lg-f .inp{
  width:100%;min-height:54px;padding:0 3.1rem;border-radius:99px;border:1px solid rgba(255,255,255,.9);
  background:rgba(255,255,255,.9);color:var(--ink);font-size:19px;font-weight:800;letter-spacing:.26em;direction:ltr;text-align:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 20px rgba(13,31,76,.16);
  transition:border-color .2s,box-shadow .2s,background-color .2s;
}
.lg .lg-f .inp::placeholder{color:rgba(11,26,66,.6);opacity:1;font-weight:500;font-size:15px;letter-spacing:0}
.lg .lg-f .inp:focus{border-color:#fff;background:#fff;box-shadow:inset 0 1px 0 #fff,0 0 0 4px rgba(255,255,255,.35),0 8px 20px rgba(13,31,76,.18)}
.lg-f .ic{position:absolute;right:1.15rem;top:50%;transform:translateY(-50%);color:rgba(11,26,66,.62);pointer-events:none;transition:color .2s}
.lg-f:focus-within>.ic{color:var(--red)}
.lg-cnt{min-height:1.3em;text-align:center;font-size:.8rem;color:#171c2b;opacity:.75;margin-top:-.2rem}
.lg-err{font-size:.85rem;text-align:center;border-radius:14px;padding:.5rem .8rem;color:#fff;background:rgba(200,30,45,.82);border:1px solid rgba(255,179,185,.5)}
.lg-err:empty{display:none}
.lg .lgb{
  display:inline-flex;align-items:center;justify-content:center;width:100%;min-height:54px;border-radius:99px;
  border:1px solid rgba(255,255,255,.45);background:linear-gradient(160deg,#f45662,#d42a37);color:#fff;
  font-weight:700;font-size:1.02rem;letter-spacing:.2px;cursor:pointer;position:relative;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),inset 0 -10px 18px -10px rgba(120,10,24,.45),0 10px 24px rgba(212,42,55,.38);
  text-shadow:0 1px 2px rgba(90,0,12,.4);transition:transform .18s var(--ease),opacity .2s,filter .2s;
}
.lg .lgb:active{transform:scale(.97)}
.lg .lgb:disabled{opacity:.5;pointer-events:none}
.lg-lock{display:flex;align-items:center;justify-content:center;gap:.4rem;margin-top:auto;padding-top:1.4rem;font-size:.76rem;color:rgba(255,255,255,.78);text-shadow:0 1px 4px rgba(13,31,76,.4)}
.lg-foot{margin-top:.5rem;text-align:center;color:rgba(255,255,255,.62);font-size:.74rem;line-height:2;text-shadow:0 1px 3px rgba(13,31,76,.35)}

/* ================= چیدمان کوچک ================= */
@media (max-width:380px){.top h1{padding-inline:70px;font-size:.95rem}}


.tkrow{display:flex;justify-content:flex-start;align-items:center;gap:10px;margin-top:14px}
.tkrow .nx{font-size:.78rem;color:var(--mut);opacity:.7}
.cmsg{position:fixed;top:50%;left:50%;z-index:150;display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 34px;border-radius:24px;background:rgba(11,26,66,.94);color:#fff;font-weight:800;font-size:1.05rem;text-align:center;box-shadow:0 20px 50px rgba(11,26,66,.35);pointer-events:none;opacity:0;visibility:hidden;transform:translate(-50%,-46%) scale(.92);transition:opacity .3s,transform .35s cubic-bezier(.22,1,.36,1),visibility .3s}
.cmsg svg{color:#3ddc97}
.cmsg.on{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}

/* تب فیلم‌ها */
.fgrid{display:grid;gap:10px}
@media(min-width:560px){.fgrid{grid-template-columns:1fr 1fr}}
a.fl{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#f3f5fb;color:var(--tx);text-decoration:none;font-weight:700;transition:transform .15s,background .2s}
a.fl:hover{background:#e9eefb}
a.fl:active{transform:scale(.98)}
.fl-p{flex:none;width:42px;height:42px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center}
.fl-t{flex:1;min-width:0;line-height:1.6}
.fl-t small{display:block;font-weight:500;color:var(--mut);font-size:.78rem}
.fl-c{flex:none;color:var(--mut);display:grid;place-items:center}
@media(max-width:430px){.tabs .tb{padding:9px 12px;font-size:.86rem}}

/* راهنمای اولین ورود */
html.gdopen,html.gdopen body{overflow:hidden}
.gd{position:fixed;inset:0;z-index:150;display:flex;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 18px) 16px calc(var(--sab) + 18px);background:radial-gradient(circle 160px at 12% 100%,rgba(229,51,63,.28),rgba(229,51,63,0) 70%),linear-gradient(165deg,#0b1a42 0%,#14306b 60%,#1f4a9a 100%);animation:gdFade .35s ease both}
.gd-in{margin:auto;width:min(100%,460px)}
.gd-dots{display:flex;justify-content:center;gap:7px;margin-bottom:14px}
.gd-dots i{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.35);transition:width .3s,background .3s}
.gd-dots i.on{width:26px;background:#fff}
.gd-card{background:#fff;color:var(--tx);border-radius:24px;padding:20px 18px 18px;box-shadow:0 24px 60px rgba(0,0,0,.28);animation:gdIn .45s cubic-bezier(.2,.8,.2,1) both}
.gd-tag{display:block;width:max-content;margin:0 auto 10px;padding:4px 14px;border-radius:99px;background:rgba(13,31,76,.07);color:var(--brand);font-weight:700;font-size:.8rem}
.gd-card h2{font-size:1.15rem;text-align:center;margin-bottom:6px}
.gd-card h2:focus{outline:none}
.gd-lead{text-align:center;line-height:2.1;font-size:1rem;margin-bottom:14px}
.gd-lead b{color:var(--brand)}
.gd-book{display:block;width:min(100%,250px);aspect-ratio:1/1;object-fit:cover;margin:0 auto 16px;border-radius:18px;box-shadow:0 14px 34px rgba(13,31,76,.28)}
.gd-stack{display:flex;flex-direction:column;gap:10px}
.gd .btn{line-height:1.7}
.gd a.btn{display:block;text-align:center;text-decoration:none}
.gd-nav{display:flex;gap:10px}
.gd-nav .btn{flex:1}
.gd-find{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px;border-radius:14px;background:#f3f5fb;color:var(--brand);line-height:1.7}
.gd-sp{flex:none;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--brand2);border-radius:50%;animation:sp .8s linear infinite}
.gd-li{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:#f3f5fb;line-height:2;font-size:.95rem}
.gd-n{flex:none;width:34px;height:34px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800}
.gd-quote{text-align:center;font-size:1.4rem;font-weight:800;color:var(--brand);margin:8px 0 20px}
@keyframes gdFade{from{opacity:0}}
@keyframes gdIn{from{opacity:0;transform:translateY(14px) scale(.98)}}
.top #gh{position:absolute;right:clamp(14px,4vw,32px);top:calc(var(--sat) + 15px);z-index:2}
.top #gh[hidden]{display:none}

/* نمایش لیست پیوست‌ها (بدون فاصله‌ی اضافی چون داخل متن‌های pre-wrap هم می‌آید) */
function filesHtml(files, bucket) {

/* کوچک‌کردن عکس‌ها قبل از ارسال (پس‌زمینه سفید برای PNG شفاف) */
function putFile(bucket, path, blob, type, onP) {
  return new Promise((res, rej) => {
    if (!SB.url || SB.url.includes('YOUR-PROJECT')) return rej(new Error('تنظیمات Supabase کامل نیست'));
    const x = new XMLHttpRequest();
    x.open('POST', `${SB.url}/storage/v1/object/${bucket}/${path}`);
    Object.entries(hdr({'Content-Type': type})).forEach(([k, v]) => x.setRequestHeader(k, v));
    x.upload.onprogress = e => { if (e.lengthComputable && onP) onP(e.loaded / e.total); };

/* آپلود یک فایل؛ خروجی: {path, name, type, size} */
async function uploadFile(bucket, folder, f, onP) {

const CLIP = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.1l-9.2 9.2a6 6 0 01-8.5-8.5l9.2-9.2a4 4 0 015.7 5.7l-9.2 9.2a2 2 0 01-2.8-2.8l8.5-8.5"/></svg>';

async function uploadPicked(pk, bucket, folder) {

let _scrollJob = 0, _scrollOff = null;
function smoothScrollTo(y, ms = 650) {

  if (Math.abs(d) < 2) return Promise.resolve();

  return new Promise(res => {
    const evs = ['wheel', 'touchstart', 'keydown', 'mousedown'], stop = () => { _scrollJob++; };
    const off = () => evs.forEach(n => removeEventListener(n, stop));

      <div class="gd-li"><span class="gd-n">۳</span><span>همچنین دروس مطالعات، عربی و ادبیات را نیز در هفته بعد تمرین کنید</span></div>

    <div class="gd-quote">موفقیت آسان نیست</div>

};

function guideStep(n) {
  clearTimeout(_gt);
  const g = document.getElementById('guide'); if (!g || !GSTEPS[n]) return;
  g.dataset.s = n;
  g.querySelectorAll('.gd-dots i').forEach((d, i) => d.classList.toggle('on', i === n - 1));
  const c = g.querySelector('#gd-card');
  c.innerHTML = `<span class="gd-tag">مرحله ${fa(n)} از ${fa(3)}</span>` + GSTEPS[n]();
  c.style.animation = 'none'; void c.offsetWidth; c.style.animation = '';
  g.scrollTop = 0;
  try { c.querySelector('h2').focus({preventScroll: true}); } catch {}
}

function guideClick(e) {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, g = document.getElementById('guide'); if (!g) return;
  if (a === 'store') return; /* لینک فروشگاه: اجازه می‌دهیم مرورگر خودش در تب جدید باز کند */
  const s = +g.dataset.s || 1;
  if (a === 'find') {
    const box = document.getElementById('gd-buy'); if (!box) return;
    box.innerHTML = '<div class="gd-find" role="status"><span class="gd-sp"></span><b>در حال یافتن ارزان‌ترین فروشگاه…</b></div>';
    clearTimeout(_gt);
    _gt = setTimeout(() => {
      const bx = document.getElementById('gd-buy'); if (!bx) return;
      bx.innerHTML = `<a class="btn ok full" data-act="store" href="${STORE_URL}" target="_blank" rel="noopener noreferrer">برای ورود به فروشگاه گاج مارکت کلیک کنید</a>`;
    }, 3500);
  } else if (a === 'next') guideStep(Math.min(3, s + 1));
  else if (a === 'prev') guideStep(Math.max(1, s - 1));
  else if (a === 'done') {
    if (nid) { lsSet('gd_' + nid, '1'); lsDel('gp_' + nid); }
    closeGuide(); scrollTo(0, 0);
  }
}

function showGuide() {
  if (document.getElementById('guide')) return;
  const g = document.createElement('div');
  g.id = 'guide'; g.className = 'gd'; g.setAttribute('role', 'dialog'); g.setAttribute('aria-modal', 'true'); g.setAttribute('aria-label', 'راهنمایی و مشاوره');
  g.innerHTML = '<div class="gd-in"><div class="gd-dots" aria-hidden="true"><i></i><i></i><i></i></div><div class="gd-card" id="gd-card"></div></div>';
  g.addEventListener('click', guideClick);
  document.body.append(g);
  document.documentElement.classList.add('gdopen');
  guideStep(1);
}

<script>
const nap = ms => new Promise(r => setTimeout(r, ms));
const SPL = document.getElementById('splash'), SPT = document.getElementById('sptx');
function splashOn(text) { SPT.textContent = text || ''; SPT.hidden = !text; SPL.classList.remove('off'); }
function splashOff() { SPL.classList.add('off'); }
const IC = {
  id: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="11" r="2"/><path d="M14 10h4M14 14h4M6 16.5c.7-1.3 1.7-1.9 3-1.9s2.3.6 3 1.9"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/>'

const ic = (n, z = 20) => `<svg class="ic" width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
let nid = lsGet('nid'), ST = null, mt, armed, PK = null;
const TABS_UI = (() => {

    cur = b.dataset.t; try { sessionStorage.setItem('tab', cur); } catch {}
    apply(true); if (scrollY > 8) smoothScrollTo(0, 450);
  };
  return {sync() { apply(false); requestAnimationFrame(() => placeInd(nav, true)); }};
})();
const app = $('#app');

function loginView(err) {
  closeGuide();
  $('#out').hidden = true; $('#gh').hidden = true; $('#tabs').hidden = true;

    <div class="lg-bot"><div class="lg-grab"></div>
      <div class="lg-head"><h2>ورود به سامانه</h2><p>برای ورود کد ملی خود را وارد کنید</p></div>
      <form class="lg-form" id="lf" autocomplete="off" novalidate>
        <div class="lg-f">${ic('id')}<input class="inp" id="nid" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="کد ملی ۱۰ رقمی" aria-label="کد ملی"></div>
        <div class="lg-cnt" id="cnt"></div>

        <button class="lgb" id="go" type="submit" disabled>ورود</button>

    </div></section>`;
  const i = $('#nid'), g = $('#go'), E = $('#lerr');

  i.oninput = () => { i.value = latin(i.value).replace(/\D/g, '').slice(0, 10); g.disabled = i.value.length !== 10; $('#cnt').textContent = i.value.length && i.value.length < 10 ? fa(i.value.length) + ' از ۱۰ رقم' : ''; E.textContent = ''; };
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    if (g.disabled) return;
    const v = i.value; g.disabled = true; E.textContent = '';
    splashOn('در حال ورود به حساب کاربری…');
    try {
      const [s] = await Promise.all([rpc('student_state', {nid: v}), nap(500)]);
      if (!s) { splashOff(); E.textContent = 'این کد ملی ثبت نشده است. با مدیر تماس بگیرید'; g.disabled = false; i.focus(); return; }
      nid = v; lsSet('nid', nid); ST = s; guideArm(v); dash(); schedule(); maybeGuide(); splashOff();
    } catch (x) { splashOff(); E.textContent = x.message; g.disabled = false; }
  };
  g.disabled = i.value.length !== 10;
  splashOff();
  setTimeout(() => { try { i.focus({preventScroll: true}); } catch {} }, 450);
}

const STUDY_COLS = [
  ['study', 'درسنامه<br>(دقیقه)'],
  ['tests', 'تست<br>(تعداد)'],
  ['correct', 'تست‌های<br>درست<br>(تعداد)'],
  ['test_min', 'زمان تست<br>(دقیقه)']
];
const colHead = () => `<tr><th style="text-align:right">درس</th>${STUDY_COLS.map(c => `<th>${c[1]}</th>`).join('')}</tr>`;
const plain = h => h.replace(/<br>/g, ' ');

function studyCard() {
  const d = dObj(ST.today);
  const head = `<div class="sh"><h2>جدول مطالعه امروز</h2><span class="chip">${hLong(d)}</span></div>`;
  if (ST.log) {
    const rs = Array.isArray(ST.log.entries) ? ST.log.entries : [];
    const has = k => rs.some(r => r[k] != null), S = k => rs.reduce((a, r) => a + (+r[k] || 0), 0);
    const cell = (r, k) => r[k] == null ? '—' : fa(r[k]);
    return `<section class="card">${head}

      <tfoot><tr><td class="ls">جمع</td>${STUDY_COLS.map(c => `<td>${has(c[0]) ? fa(S(c[0])) : '—'}</td>`).join('')}</tr></tfoot></table></div>

      <div class="tkrow">${seenB(ST.log.seen_by)}<span class="nx">جدول فردا از ساعت ۰۰:۰۰ باز می‌شود.</span></div></section>`;
  }
  return `<section class="card">${head}
    <p class="sub" style="margin-bottom:10px">برای هر درسی که امروز خواندی، زمان درسنامه، تعداد تست، تعداد تست‌های درست و زمان تست را بنویس. درس‌هایی که نخواندی را خالی بگذار.</p>
    <div class="tw"><table id="tb"><thead>${colHead()}</thead><tbody>
    ${LESSONS.map((l, i) => `<tr><td class="ls">${l}</td>${STUDY_COLS.map(c => `<td><input class="inp num" inputmode="numeric" maxlength="4" placeholder="۰" data-i="${i}" data-k="${c[0]}" aria-label="${l} — ${plain(c[1])}"></td>`).join('')}</tr>`).join('')}
    </tbody><tfoot><tr><td class="ls">جمع</td>${STUDY_COLS.map(c => `<td id="t-${c[0]}">۰</td>`).join('')}</tr></tfoot></table></div>
    <div class="fld" style="margin-top:20px"><label for="ex">فعالیت‌های اضافی</label><textarea class="inp" id="ex" maxlength="300" rows="2"></textarea></div>
    <button class="btn full" id="sub">ثبت</button></section>`;
}

const seenB = by => by ? `<span class="tk ok" role="img" aria-label="دیده شد" title="دیده شد"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12.5l4.5 4.5L16 7.5"/><path d="M9.5 15.5l1.5 1.5L21 7.5"/></svg></span>` : `<span class="tk" role="img" aria-label="ارسال شد" title="ارسال شد"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>`;
const tmS = t => new Date(t).toLocaleTimeString('fa-IR', {hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Tehran'});
const nl = t => esc(t).replace(/\n/g, '<br>');

const hwItem = h => `<div class="hw">${h.body ? `<p>${nl(h.body)}</p>` : ''}${filesHtml(h.files, 'attachments')}<time>${hShort(new Date(h.at))}</time></div>`;

function persCard() {
  const p = ST.personal || [];
  if (!p.length) return '';
  return `<section class="card pw"><h2>تکلیف اختصاصی تو</h2>${p.map(hwItem).join('')}</section>`;
}

function notesCard() {
  const n = ST.notes || [];
  if (!n.length) return '';
  return `<section class="card nt"><h2>پیام‌های دبیر</h2>${n.map(x => `<div class="hw"><b class="by">${esc(x.by || 'دبیر')}</b>${x.body ? `<p>${nl(x.body)}</p>` : ''}${filesHtml(x.files, 'attachments')}<time>${hShort(new Date(x.at))} — ${tmS(x.at)}</time></div>`).join('')}</section>`;
}

function hwList() {
  return ST.homework.length ? ST.homework.map(hwItem).join('') : '<p class="mut">تکلیفی ثبت نشده است.</p>';
}

function hwCard() {
  const up = ST.submit_on ? `<div class="up"><p class="sub" style="margin-top:14px">می‌توانی عکس یا فایل تکلیفت را (PDF، Word، PowerPoint و…) برای دبیر بفرستی.</p><div id="pk"></div><button class="btn full" id="send" disabled>ارسال برای دبیر</button></div>` : '';
  return `<section class="card"><h2>تکالیف</h2><div id="hwl">${hwList()}</div>${up}</section>`;
}

function subsCard() {
  const r = ST.subs || [];
  if (!r.length) return '';
  return `<section class="card"><h2>فایل‌های ارسال‌شده</h2>${r.map(x => {
    const u = pubUrl('submissions', x.path), th = canPreview(x.path, '') ? `<span class="fi thumb"><img loading="lazy" src="${u}" alt="" onerror="this.remove()"></span>` : fileBadge(x.path, '');
    return `<div class="sr"><a class="sn" href="${u}" target="_blank" rel="noopener">${th}<span class="an"><b>${esc(x.fname || 'فایل ارسالی')}</b><small>${hShort(new Date(x.at))} — ${tmS(x.at)}</small></span></a>${seenB(x.seen_by)}</div>`;
  }).join('')}</section>`;
}

function cmList() {

  return c.map(x => `<div class="cm"><p>${esc(x.body)}</p><div class="meta"><time class="sub">${hShort(new Date(x.at))} — ${tmS(x.at)}</time>${seenB(x.seen_by)}</div>${x.reply ? `<div class="rep"><b>پاسخ ${esc(x.replied_by || 'دبیر')}</b><p>${esc(x.reply)}</p></div>` : ''}</div>`).join('');
}

function cmCard() {
  return `<section class="card"><h2>نظرات و پیام‌ها</h2>
    <div class="fld"><label for="cmt">پیام یا سؤال خودت را برای دبیر بنویس</label>
    <textarea class="inp" id="cmt" maxlength="1000" placeholder="اینجا بنویس..."></textarea><div class="cc" id="cmc">0 / 1000</div></div>
    <button class="btn full" id="cms" disabled>ارسال پیام</button>
    <div id="cml" style="margin-top:20px">${cmList()}</div></section>`;
}

function bindComment() {
  const t = $('#cmt'), b = $('#cms');
  if (!t) return;
  const upd = () => { $('#cmc').textContent = t.value.length + ' / 1000'; b.disabled = !t.value.trim(); };
  t.oninput = upd; upd();
  b.onclick = async () => {
    const v = t.value.trim(); if (!v || b.disabled) return;
    b.disabled = true;
    try {
      await rpc('submit_comment', {nid, b: v});
      t.value = ''; upd();
      toast('پیام ارسال شد');
      const s = await rpc('student_state', {nid}); if (s) { ST = s; $('#cml').innerHTML = cmList(); }
    } catch (e) { toast(e.message); upd(); }
  };
}

function classCard() {
  const n = ST.next_class || {};
  return `<section class="card"><h2>کلاس بعدی</h2>${n.date ? `<div class="cls"><b>${hLong(dObj(n.date))}</b>${n.title ? `<span class="chip">${esc(n.title)}</span>` : ''}</div>` : '<p class="mut">هنوز زمان کلاس بعدی اعلام نشده است.</p>'}</section>`;
}

function dash() {
  document.documentElement.classList.remove('lgn'); document.body.classList.remove('lgn'); document.body.classList.remove('kb');
  $('#out').hidden = false; $('#gh').hidden = false; $('#tabs').hidden = false; PK = null;
  const s = ST.student;
  app.innerHTML = `<div class="sec" id="s-study"><section class="card hello"><h2>${esc(s.first_name + ' ' + s.last_name)} عزیز</h2><div class="dt">${hLong(dObj(ST.today))}</div></section>
    <div id="c-study"></div></div><div class="sec" id="s-hw"><div id="c-pers"></div><div id="c-hw"></div><div id="c-subs"></div><div id="c-class"></div></div><div class="sec" id="s-msg"><div id="c-notes"></div>${cmCard()}</div><div class="sec" id="s-film">${filmCard()}</div>`;
  TABS_UI.sync();
  setHtml($('#c-study'), studyCard()); setHtml($('#c-notes'), notesCard()); setHtml($('#c-pers'), persCard());
  setHtml($('#c-hw'), hwCard()); setHtml($('#c-subs'), subsCard()); setHtml($('#c-class'), classCard());
  const tb = $('#tb');
  if (tb) {
    tb.oninput = e => {
      const t = e.target; if (!t.dataset.k) return;
      t.value = latin(t.value).replace(/\D/g, '').slice(0, 4);
      const sum = k => [...tb.querySelectorAll(`[data-k="${k}"]`)].reduce((a, x) => a + (+x.value || 0), 0);

      LESSONS.forEach((_, i) => markRow(i));
    };

    const ex = $('#ex');
    ex.addEventListener('input', () => { ex.style.height = 'auto'; ex.style.height = Math.max(84, ex.scrollHeight) + 'px'; });
    ex.addEventListener('focus', () => { document.body.classList.add('kb'); setTimeout(() => ex.scrollIntoView({block: 'center', behavior: 'smooth'}), 320); });
    ex.addEventListener('blur', () => document.body.classList.remove('kb'));
  }
  if ($('#pk')) bindUpload();
  bindComment();
}

const rowVal = (i, k) => { const el = $(`#tb [data-i="${i}"][data-k="${k}"]`); return el ? +(el.value || 0) : 0; };
function markRow(i) {
  const el = $(`#tb [data-i="${i}"][data-k="correct"]`);
  if (el) el.classList.toggle('bad', rowVal(i, 'correct') > rowVal(i, 'tests'));
}

async function submitLog() {
  const b = $('#sub'), rows = []; let bad = -1;
  LESSONS.forEach((l, i) => {
    const r = {lesson: l, study: rowVal(i, 'study'), tests: rowVal(i, 'tests'), correct: rowVal(i, 'correct'), test_min: rowVal(i, 'test_min')};
    if (r.study || r.tests || r.correct || r.test_min) rows.push(r);
    if (bad < 0 && r.correct > r.tests) bad = i;
  });
  if (!rows.length) { toast('حداقل برای یک درس اطلاعات وارد کن'); return; }
  if (bad > -1) {
    toast('در درس «' + LESSONS[bad] + '» تعداد تست‌های درست نمی‌تواند از تعداد تست‌ها بیشتر باشد');
    const el = $(`#tb [data-i="${bad}"][data-k="correct"]`); if (el) { try { el.focus(); } catch {} }
    return;
  }
  if (!armed) { armed = true; b.textContent = 'مطمئنی؟ پس از ثبت قابل ویرایش نیست. دوباره بزن'; b.classList.add('red'); setTimeout(() => { armed = false; if (b.isConnected) { b.textContent = 'ثبت'; b.classList.remove('red'); } }, 5000); return; }
  armed = false; b.disabled = true;
  try { await rpc('submit_log', {nid, r: rows, ex: $('#ex').value.trim()}); await load(); centerMsg('گزارش امروز ثبت شد'); }
  catch (e) { toast(e.message); await load().catch(() => {}); }
}

function bindUpload() {
  const host = $('#pk'), s = $('#send'); if (!host || !s) return;
  PK = picker(host, {big: true, max: 10, title: 'انتخاب فایل یا تصویر تکلیف',
    hint: 'تصویر، PDF، Word، PowerPoint، Excel، متن یا ZIP — تا ۲۰ مگابایت برای هر فایل',
    onChange: p => { s.disabled = !p.items.length || p.busy; }});
  s.onclick = async () => {
    const pk = PK; if (!pk || !pk.items.length || pk.busy) return;
    s.disabled = true; pk.busyOn(true);
    let ok = 0, fail = 0;
    for (const it of pk.items.slice()) {
      const i = pk.items.indexOf(it);
      try {
        it.err = '';
        const m = await uploadFile('submissions', ST.student.id, it.f, p => pk.prog(i, p));
        await rpc('submit_file', {nid, fpath: m.path, fname: it.f.name});
        ok++; pk.drop(it);
      } catch (e) { fail++; pk.fail(it, e.message); if (/بسته/.test(e.message)) break; }
    }
    pk.busyOn(false); s.disabled = !pk.items.length;
    if (ok) { toast(fail ? fa(ok) + ' فایل ارسال شد؛ ' + fa(fail) + ' فایل ناموفق بود' : ok > 1 ? fa(ok) + ' فایل با موفقیت ارسال شد' : 'فایل با موفقیت ارسال شد'); refresh(); }
    else if (fail) toast('ارسال ناموفق بود؛ دوباره تلاش کن');
  };
}

async function shrink(f) {
  try {
    const bm = await createImageBitmap(f), k = Math.min(1, 1800 / Math.max(bm.width, bm.height));
    if (k === 1 && f.size < 1.5e6 && f.type === 'image/jpeg') { if (bm.close) bm.close(); return f; }
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(bm.width * k)); c.height = Math.max(1, Math.round(bm.height * k));
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(bm, 0, 0, c.width, c.height);
    if (bm.close) bm.close();
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', .85));
    return b && b.size < f.size ? b : f;
  } catch { return f; }
}

async function load() {
  const s = await rpc('student_state', {nid});
  if (!s) { logout(); return; }
  const same = ST && ST.today === s.today, keep = {};
  document.querySelectorAll('#tb [data-i]').forEach(x => { if (x.value) keep[x.dataset.i + '|' + x.dataset.k] = x.value; });
  const ex = $('#ex') && $('#ex').value, cm = $('#cmt') && $('#cmt').value;
  const keepFiles = PK ? PK.items.slice() : null;
  ST = s; dash();
  if (keepFiles && keepFiles.length && PK) PK.restore(keepFiles);
  if (same) {
    let last = null;
    Object.entries(keep).forEach(([k, v]) => { const [i, kk] = k.split('|'); const el = $(`#tb [data-i="${i}"][data-k="${kk}"]`); if (el) { el.value = v; last = el; } });
    if (last) last.dispatchEvent(new Event('input', {bubbles: true}));
    if (ex && $('#ex')) $('#ex').value = ex;
  }
  if (cm && $('#cmt')) { $('#cmt').value = cm; $('#cmt').dispatchEvent(new Event('input')); }
}

let rb = false;
async function refresh() {
  if (rb || !ST || !nid) return;
  rb = true;
  try {
    const s = await rpc('student_state', {nid});
    if (!s) { logout(); return; }
    if (s.today !== ST.today) { rb = false; await load(); return; }
    const upOld = !!ST.submit_on;
    ST = s;
    setHtml($('#c-notes'), notesCard()); setHtml($('#c-pers'), persCard()); setHtml($('#c-subs'), subsCard());
    setHtml($('#cml'), cmList());
    if (ST.log) setHtml($('#c-study'), studyCard());
    setHtml($('#c-class'), classCard());
    if (upOld !== !!s.submit_on) { setHtml($('#c-hw'), hwCard()); if ($('#pk')) bindUpload(); }
    else setHtml($('#hwl'), hwList());
  } catch {} finally { rb = false; }
}

function logout() { lsDel('nid'); nid = null; ST = null; clearTimeout(mt); loginView(); }

function schedule() {
  clearTimeout(mt);
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB', {timeZone: 'Asia/Tehran', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit'}).formatToParts(new Date()).map(x => [x.type, x.value]));
  const sec = (+p.hour % 24) * 3600 + +p.minute * 60 + +p.second;
  mt = setTimeout(async () => { try { await load(); } catch {} schedule(); }, (86400 - sec) * 1000 + 800);
}

document.addEventListener('visibilitychange', () => { if (!document.hidden && ST) { if (todayStr() !== ST.today) load().catch(() => {}); else refresh(); } });
setInterval(() => { if (!document.hidden && ST) refresh(); }, 60000);
$('#out').onclick = logout;
$('#gh').onclick = showGuide;

(async () => {
  if (!nid) return loginView();
  splashOn('در حال ورود به حساب کاربری…');
  try { await Promise.all([load(), nap(450)]); if (nid) schedule(); maybeGuide(); splashOff(); }
  catch (e) { loginView(e.message); }
})();
</script>
